name: Windows release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:check
      - name: Check updater signing configuration
        shell: pwsh
        env:
          STICKYNOTE_UPDATER_PUBLIC_KEY: ${{ vars.STICKYNOTE_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) { throw 'Missing TAURI_SIGNING_PRIVATE_KEY secret' }
          ./scripts/updater-config.ps1
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test --maxWorkers=1
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib --locked
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: StickyNote v__VERSION__
          releaseBody: '更新内容を記載してから公開してください。'
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: --bundles nsis --config src-tauri/tauri.updater.local.json -- --locked
      - name: Verify personal distribution signatures
        shell: pwsh
        env:
          STICKYNOTE_UPDATER_PUBLIC_KEY: ${{ vars.STICKYNOTE_UPDATER_PUBLIC_KEY }}
        run: ./scripts/verify-windows-release.ps1
