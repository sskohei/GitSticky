[package]
name = "sticky-note"
version = "0.1.0"
edition = "2021"
rust-version = "1.94"

[lib]
name = "sticky_note_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-stronghold = "2"
sqlx = { version = "0.9", default-features = false, features = ["sqlite", "runtime-tokio", "json", "derive"] }
libsqlite3-sys = { version = "0.39.1", features = ["bundled"] }
aes-gcm = { version = "0.10.3", features = ["zeroize"] }
tokio = { version = "1", features = ["sync", "time", "macros", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
argon2 = "0.5"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
async-trait = "0.1"

[target.'cfg(windows)'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
windows-sys = { version = "0.61", features = ["Win32_Security_Cryptography", "Win32_Foundation", "Win32_System_Memory", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Storage_FileSystem"] }

[dev-dependencies]
minisign-verify = "0.3"

# Stronghold's default snapshot work factor is intentionally unchanged. Optimize
# these CPU-heavy primitives even in dev builds so vault operations stay usable.
[profile.dev.package.scrypt]
opt-level = 3
[profile.dev.package.salsa20]
opt-level = 3
[profile.dev.package.pbkdf2]
opt-level = 3

# Upstream SQLx 0.9 caps SQLite below the security-fixed release.
[patch.crates-io]
sqlx-sqlite = { path = "vendor/sqlx-sqlite" }
